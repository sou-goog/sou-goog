name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: sou-goog
          template: classic
          
          # 1. THIS IS THE CRITICAL LINE. IT MUST BE EMPTY QUOTES.
          # This removes: Header, Repositories List, Community Stats, Metadata
          base: "" 
          
          # 2. This adds the "Activity Overview" Title & Description
          plugin_introduction: yes
          plugin_introduction_title: yes
          
          # 3. This adds the Radar/Spider Graph
          plugin_followup: yes
          plugin_followup_sections: repositories
          
          config_timezone: Asia/Kolkata
