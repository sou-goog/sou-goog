name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: sou-goog
          template: classic
          
          # 1. DISABLE THE WALL OF TEXT (Crucial Step)
          base: "" 
          
          # 2. ENABLE ONLY THE SPIDER GRAPH
          plugin_followup: yes
          plugin_followup_sections: repositories
          
          config_timezone: Asia/Kolkata
